// State
let cities = [];
let tileOwners = {}; // tileIndex => owner address
let tileUpdates = {}; // tileIndex => update txHash
let tileNames = {};  // tileIndex => custom name
let spritesheet = null;
let zoom = 0.3;
let panX = 0;
let panY = 0;

// Calculate city dimensions in isometric space
const CITY_ISO_W = GRID * TILE_W;  // width of one city in iso coords
const CITY_ISO_H = GRID * TILE_H;  // height of one city in iso coords

// Load cities from KV
async function loadCities() {
  document.getElementById('load-status').textContent = 'Loading from cache...';

  // Load maps, owners, and updates from KV
  let baseMaps = [];
  try {
    const mapsResp = await fetch('https://chainhost.online/api/isocity/maps');
    if (mapsResp.ok) {
      const { maps } = await mapsResp.json();
      // Convert from object to array
      for (let i = 0; i < 40; i++) {
        const mapData = maps[i];
        if (mapData) {
          const parsed = typeof mapData === 'string' ? JSON.parse(mapData) : mapData;
          baseMaps[i] = parsed;
        } else {
          baseMaps[i] = { map: [], hash: '' };
        }
      }
      console.log('Loaded maps from KV');
    }
  } catch (e) {
    console.error('Failed to load maps from KV:', e);
  }

  // Use maps as our tiles
  cities = baseMaps.slice(0, 40).map((city, index) => ({
    ...city,
    tileIndex: index,
    txHash: TILE_TXS[index],
    name: `Tile #${index}`
  }));

  // Load owners and updates from KV
  await loadFromKV();

  // Then refresh from chain in background
  refreshFromChain();

  return cities;
}

// Load owners and updates from KV (fast)
async function loadFromKV() {
  try {
    // Load owners
    const ownersResp = await fetch('https://chainhost.online/api/isocity/owners');
    if (ownersResp.ok) {
      const { owners } = await ownersResp.json();
      for (const [tileId, owner] of Object.entries(owners || {})) {
        const idx = parseInt(tileId);
        tileOwners[idx] = owner.toLowerCase();
        if (cities[idx]) cities[idx].owner = owner.toLowerCase();
      }
    }

    // Load updates
    const updatesResp = await fetch('https://chainhost.online/api/isocity/updates');
    if (updatesResp.ok) {
      const { updates } = await updatesResp.json();
      for (const [tileId, txHash] of Object.entries(updates || {})) {
        const idx = parseInt(tileId);
        tileUpdates[idx] = txHash;
        // Load the actual tile content from the update tx
        try {
          const content = await fetchTileFromChain(txHash);
          if (content && content.map && cities[idx]) {
            cities[idx].map = content.map;
            cities[idx].updateTx = txHash;
            console.log(`Loaded tile ${idx} update from KV`);
          }
        } catch (e) {
          console.error(`Failed to load tile ${idx} content:`, e);
        }
      }
    }

    // Load custom names
    try {
      const namesResp = await fetch('https://chainhost.online/api/isocity/names');
      if (namesResp.ok) {
        const data = await namesResp.json();
        tileNames = data.names || data || {};
        console.log('Loaded tile names:', tileNames);
      }
    } catch (e) {
      console.error('Failed to load names:', e);
    }
  } catch (e) {
    console.error('Failed to load from KV:', e);
  }
}

// Refresh owners from chain in background (slow, but keeps KV updated)
async function refreshFromChain() {
  // Don't block - run in background
  setTimeout(async () => {
    await fetchAllTileOwners();
    // Save updated owners to KV
    try {
      await fetch('https://chainhost.online/api/isocity/owners', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ updates: tileOwners })
      });
    } catch (e) {
      console.error('Failed to save owners to KV:', e);
    }
  }, 100);
}

// Fetch current owners for all tiles
async function fetchAllTileOwners() {
  // Use ethscriptions API to get current owners
  const batchSize = 6;
  for (let i = 0; i < TILE_TXS.length; i += batchSize) {
    const batch = TILE_TXS.slice(i, i + batchSize);
    await Promise.all(batch.map(async (txHash, idx) => {
      const tileIndex = i + idx;
      try {
        const owner = await getEthscriptionOwner(txHash);
        if (owner) {
          tileOwners[tileIndex] = owner.toLowerCase();
          if (cities[tileIndex]) {
            cities[tileIndex].owner = owner.toLowerCase();
          }
        }
      } catch (e) {
        console.error(`Failed to get owner for tile ${tileIndex}:`, e);
      }
    }));
  }
}

// Get current owner of an ethscription
async function getEthscriptionOwner(txHash) {
  // Try ethscriptions.com API first
  try {
    const resp = await fetch(`https://api.ethscriptions.com/v2/ethscriptions/${txHash}`);
    if (resp.ok) {
      const text = await resp.text();
      if (text.startsWith('{')) {
        const data = JSON.parse(text);
        return data.result?.current_owner || data.current_owner || null;
      }
    }
  } catch (e) {}

  // Fallback: get original recipient from tx
  try {
    const resp = await fetch('https://1rpc.io/eth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'eth_getTransactionByHash',
        params: [txHash],
        id: 1
      })
    });
    const text = await resp.text();
    if (!text.startsWith('{')) return null;
    const { result } = JSON.parse(text);
    return result?.to || null;
  } catch (e) {
    return null;
  }
}

// Load tile updates from owners
async function loadTileUpdates() {
  // Check localStorage for known updates first
  const localUpdates = JSON.parse(localStorage.getItem('isocity_tile_updates') || '{}');

  // Hardcoded known updates (verified on-chain)
  const knownUpdates = {
    0: '0x4eb87d6e105ecb6857c0c3ad85fd3963599477bcf9fd46ff32980d781d2a0a78'
  };

  // Also scan chain for updates from tile owners
  const chainUpdates = await scanForTileUpdates();

  // Merge: known > chain > local
  const updates = { ...localUpdates, ...chainUpdates, ...knownUpdates };

  // Save merged updates back to localStorage
  localStorage.setItem('isocity_tile_updates', JSON.stringify(updates));

  for (const [tileIndex, updateTx] of Object.entries(updates)) {
    const idx = parseInt(tileIndex);
    if (cities[idx]) {
      try {
        const tileData = await fetchTileFromChain(updateTx);
        if (tileData && tileData.map) {
          cities[idx].map = tileData.map;
          cities[idx].updateTxHash = updateTx;
        }
      } catch (e) {
        console.error(`Failed to load update for tile ${idx}:`, e);
      }
    }
  }
}

// Scan chain for tile updates from owners
async function scanForTileUpdates() {
  const updates = {};

  // Group tiles by owner to minimize API calls
  const ownerTiles = {};
  for (let i = 0; i < 36; i++) {
    const owner = tileOwners[i];
    if (owner) {
      if (!ownerTiles[owner]) ownerTiles[owner] = [];
      ownerTiles[owner].push(i);
    }
  }

  // Check each owner's recent ethscriptions
  for (const [owner, tiles] of Object.entries(ownerTiles)) {
    try {
      // Get recent ethscriptions created by this owner
      const resp = await fetch(`https://api.ethscriptions.com/v2/ethscriptions?creator=${owner}&mime_type=text/html&per_page=20`);
      if (!resp.ok) continue;

      const text = await resp.text();
      if (!text.startsWith('{')) continue;

      const data = JSON.parse(text);
      const ethscriptions = data.result || data.ethscriptions || [];

      for (const esc of ethscriptions) {
        // Check if this is an isocity tile update
        const txHash = esc.transaction_hash || esc.txHash;
        if (!txHash) continue;

        // Try to parse it
        const tileData = await fetchTileFromChain(txHash);
        if (tileData && tileData.tileId !== undefined) {
          // Check if this owner owns this tile
          const tileIdx = tileData.tileId;
          if (tiles.includes(tileIdx)) {
            // This is a valid update for a tile they own
            // Check if it's newer than what we have
            const existingTx = updates[tileIdx];
            if (!existingTx) {
              updates[tileIdx] = txHash;
              console.log(`Found tile ${tileIdx} update: ${txHash}`);
            }
          }
        }
      }
    } catch (e) {
      console.error(`Failed to scan updates for ${owner}:`, e);
    }
  }

  return updates;
}

// Fetch and parse a tile ethscription from chain
async function fetchTileFromChain(txHash) {
  const rpcUrl = 'https://1rpc.io/eth';

  const resp = await fetch(rpcUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0',
      method: 'eth_getTransactionByHash',
      params: [txHash],
      id: 1
    })
  });

  const text = await resp.text();
  if (!text.startsWith('{')) return null;
  const { result } = JSON.parse(text);
  if (!result || !result.input) return null;

  // Decode calldata to string
  const hex = result.input.slice(2);
  let dataStr = '';
  for (let i = 0; i < hex.length; i += 2) {
    dataStr += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
  }

  // Check if it's an HTML ethscription (handles both with and without extra params)
  // Use lastIndexOf because collection format has multiple base64 parts
  if (dataStr.startsWith('data:text/html;')) {
    const base64Start = dataStr.lastIndexOf('base64,');
    if (base64Start !== -1) {
      const base64 = dataStr.slice(base64Start + 7);
      const html = atob(base64);
      return parseHtmlEthscription(html, result.to);
    }
  }

  // Check for older JSON format
  if (dataStr.startsWith('data:application/json,')) {
    const json = JSON.parse(dataStr.slice('data:application/json,'.length));
    if (json.p === 'isocity') {
      return parseJsonEthscription(json);
    }
  }

  return null;
}

// Parse HTML ethscription to extract map data
function parseHtmlEthscription(html, owner) {
  // New format: H='base64string' where each byte = row*12 + col
  const hMatch = html.match(/H='([A-Za-z0-9+/=]+)'/);
  if (hMatch) {
    const b64 = hMatch[1];
    const bytes = atob(b64);
    const map = [];
    for (let i = 0; i < GRID; i++) {
      map[i] = [];
      for (let j = 0; j < GRID; j++) {
        const idx = i * GRID + j;
        const v = bytes.charCodeAt(idx);
        if (v === 255) {
          map[i][j] = null; // hole
        } else {
          const row = Math.floor(v / 12);
          const col = v % 12;
          map[i][j] = [row, col];
        }
      }
    }
    const titleMatch = html.match(/IsoCity Tile #(\d+)/);
    const tileId = titleMatch ? parseInt(titleMatch[1]) : 0;
    return { map, name: `Tile #${tileId}`, owner, tileId };
  }

  // Old format: const M=[sq,sprite,sq,sprite,...];
  const mapMatch = html.match(/const M=\[([^\]]+)\]/);
  if (!mapMatch) return null;

  const mapData = mapMatch[1].split(',').map(Number);

  // Convert to 7x7 map format
  const map = [];
  for (let i = 0; i < GRID; i++) {
    map[i] = [];
    for (let j = 0; j < GRID; j++) {
      map[i][j] = [0, 0]; // default grass
    }
  }

  // Parse pairs: [sq, spriteId, sq, spriteId, ...]
  for (let k = 0; k < mapData.length; k += 2) {
    const sq = mapData[k];
    const spriteId = mapData[k + 1];
    const i = Math.floor(sq / GRID);
    const j = sq % GRID;
    if (i >= 0 && i < GRID && j >= 0 && j < GRID) {
      // Convert spriteId to [row, col] format
      const row = Math.floor(spriteId / TEX_W);
      const col = spriteId % TEX_W;
      map[i][j] = [row, col];
    }
  }

  // Extract tile ID from title if present
  const titleMatch = html.match(/IsoCity Tile #(\d+)/);
  const tileId = titleMatch ? parseInt(titleMatch[1]) : 0;

  return {
    map,
    name: `Tile #${tileId}`,
    owner,
    tileId
  };
}

// Parse JSON ethscription (older format)
function parseJsonEthscription(json) {
  if (json.op !== 'update' || !json.g) return null;

  const map = [];
  for (let i = 0; i < GRID; i++) {
    map[i] = [];
    for (let j = 0; j < GRID; j++) {
      map[i][j] = [0, 0]; // default grass
    }
  }

  // Parse compact format: "sq:spriteId|sq:spriteId|..."
  const placements = json.g.split('|');
  for (const p of placements) {
    const [sq, spriteId] = p.split(':').map(Number);
    const i = Math.floor(sq / GRID);
    const j = sq % GRID;
    if (i >= 0 && i < GRID && j >= 0 && j < GRID) {
      const row = Math.floor(spriteId / TEX_W);
      const col = spriteId % TEX_W;
      map[i][j] = [row, col];
    }
  }

  return {
    map,
    name: `Tile #${json.tile || 0}`,
    tileId: json.tile || 0
  };
}

// Add a tile tx to track
function addTileToTrack(txHash, owner, tileId) {
  const tiles = JSON.parse(localStorage.getItem('isocity_tiles') || '[]');
  if (!tiles.find(t => t.txHash === txHash)) {
    tiles.push({ txHash, owner, tileId, addedAt: Date.now() });
    localStorage.setItem('isocity_tiles', JSON.stringify(tiles));
  }
}

// Search existing tiles by owner address
let highlightedTiles = [];

function searchTiles() {
  const input = document.getElementById('search-input');
  const query = input.value.trim().toLowerCase();

  if (!query) {
    highlightedTiles = [];
    renderWorld();
    return;
  }

  // Find tiles owned by this address
  const matches = [];
  cities.forEach((city, index) => {
    const owner = city.owner || tileOwners[index];
    if (owner && owner.toLowerCase().includes(query)) {
      matches.push(index);
    }
  });

  if (matches.length > 0) {
    highlightedTiles = matches;
    // Pan to first match
    const pos = getCityWorldPos(matches[0]);
    panX = -pos.x * zoom;
    panY = -pos.y * zoom;
    renderWorld();
    document.getElementById('load-status').textContent = `Found ${matches.length} tile(s)`;
  } else {
    highlightedTiles = [];
    renderWorld();
    document.getElementById('load-status').textContent = 'No tiles found';
  }
}

// Show tiles owned by connected wallet
function showMyTiles() {
  if (!connectedWallet) return;

  const matches = [];
  cities.forEach((city, index) => {

    if (owner && owner.toLowerCase() === connectedWallet.toLowerCase()) {

// Load spritesheet
function loadSpritesheet() {
  return new Promise((resolve, reject) => {
    spritesheet = new Image();
    spritesheet.onload = () => resolve(spritesheet);
    spritesheet.onerror = reject;
    spritesheet.src = 'textures/01_130x66_130x230.png';
  });
}

// Get city position in world (isometric coordinates)
function getCityWorldPos(index) {
  const col = index % WORLD_COLS;
  const row = Math.floor(index / WORLD_COLS);

  // Offset each city so edges touch
  // In isometric: moving right = +x in screen, moving down = +y
  // Each city is GRID tiles wide/tall
  const offsetX = (col - row) * (GRID * TILE_W / 2);
  const offsetY = (col + row) * (GRID * TILE_H / 2);

  return { x: offsetX, y: offsetY };
}

// Render single city at offset
function renderCity(ctx, map, offsetX, offsetY) {
  for (let i = 0; i < GRID; i++) {
    for (let j = 0; j < GRID; j++) {
      const cell = map[i][j];
      if (!cell) continue; // skip holes (null)
      const [row, col] = cell;
      const screenX = offsetX + (j - i) * TILE_W / 2;
      const screenY = offsetY + (i + j) * TILE_H / 2;

      ctx.drawImage(
        spritesheet,
        col * SPRITE_W, row * SPRITE_H, SPRITE_W, SPRITE_H,
        screenX - SPRITE_W / 2, screenY - SPRITE_H + TILE_H,
        SPRITE_W, SPRITE_H
      );
    }
  }
}

// Render entire world
function renderWorld() {
  const canvas = document.getElementById('world');
  const container = document.getElementById('world-container');
  const ctx = canvas.getContext('2d');

  // Set canvas to container size
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  // Clear
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Apply zoom and pan
  ctx.save();
  ctx.translate(canvas.width / 2 + panX, canvas.height / 3 + panY);
  ctx.scale(zoom, zoom);

  // Render each city
  cities.forEach((city, index) => {
    const pos = getCityWorldPos(index);
    renderCity(ctx, city.map, pos.x, pos.y);
  });

  // Draw highlights on searched/owned tiles
  if (highlightedTiles.length > 0) {
    ctx.strokeStyle = '#c3ff00';
    ctx.lineWidth = 3 / zoom;
    highlightedTiles.forEach(index => {
      const pos = getCityWorldPos(index);
      // Draw diamond outline around tile
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y - 10);
      ctx.lineTo(pos.x + GRID * TILE_W / 2 + 10, pos.y + GRID * TILE_H / 2);
      ctx.lineTo(pos.x, pos.y + GRID * TILE_H + 10);
      ctx.lineTo(pos.x - GRID * TILE_W / 2 - 10, pos.y + GRID * TILE_H / 2);
      ctx.closePath();
      ctx.stroke();
    });
  }

  ctx.restore();

  // Update zoom display
  document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
}

// Find which city was clicked
function getCityAtPoint(screenX, screenY) {
  const canvas = document.getElementById('world');

  // Convert screen coords to world coords
  const worldX = (screenX - canvas.width / 2 - panX) / zoom;
  const worldY = (screenY - canvas.height / 3 - panY) / zoom;

  // Check each city
  for (let index = 0; index < cities.length; index++) {
    const pos = getCityWorldPos(index);

    // City bounds in world coords (rough isometric bounding box)
    const minX = pos.x - GRID * TILE_W / 2;
    const maxX = pos.x + GRID * TILE_W / 2;
    const minY = pos.y;
    const maxY = pos.y + GRID * TILE_H;

    if (worldX >= minX && worldX <= maxX && worldY >= minY && worldY <= maxY) {
      return index;
    }
  }
  return -1;
}

// Render city in panel
function renderPanelCity(city) {
  const canvas = document.getElementById('panel-canvas');
  const ctx = canvas.getContext('2d');

  const scale = canvas.width / 910;

  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Validate map structure
  if (!city.map || !Array.isArray(city.map) || city.map.length !== GRID) {
    console.error('Invalid map structure:', city.map);
    return;
  }

  ctx.save();
  ctx.translate(canvas.width / 2, TILE_H * 2 * scale);
  ctx.scale(scale, scale);

  for (let i = 0; i < GRID; i++) {
    if (!Array.isArray(city.map[i])) continue;
    for (let j = 0; j < GRID; j++) {
      const cell = city.map[i][j];
      if (!cell || !Array.isArray(cell)) continue; // skip holes and invalid cells
      const [row, col] = cell;
      if (typeof row !== 'number' || typeof col !== 'number') continue;
      const screenX = (j - i) * TILE_W / 2;
      const screenY = (i + j) * TILE_H / 2;
      ctx.drawImage(
        spritesheet,
        col * SPRITE_W, row * SPRITE_H, SPRITE_W, SPRITE_H,
        screenX - SPRITE_W / 2, screenY - SPRITE_H + TILE_H,
        SPRITE_W, SPRITE_H
      );
    }
  }
  ctx.restore();
}

// Fetch tx recipient (owner)
async function fetchTxRecipient(txHash) {
  try {
    const resp = await fetch('https://1rpc.io/eth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'eth_getTransactionByHash',
        params: [txHash],
        id: 1
      })
    });
    const text = await resp.text();
    if (!text.startsWith('{')) return null;
    const { result } = JSON.parse(text);
    return result?.to || null;
  } catch (e) {
    return null;
  }
}

// Resolve ENS name
async function resolveENS(address) {
  try {
    // Reverse lookup: addr.reverse -> name
    const node = address.slice(2).toLowerCase() + '.addr.reverse';
    const resp = await fetch('https://1rpc.io/eth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'eth_call',
        params: [{
          to: '0x231b0Ee14048e9dCcD1d247744d114a4EB5E8E63', // Universal Resolver
          data: '0x9061b923' + encodeNode(node) // resolve(bytes,bytes)
        }, 'latest'],
        id: 1
      })
    });
    const text = await resp.text();
    if (text.startsWith('{')) {
      const { result } = JSON.parse(text);
      if (result && result !== '0x' && result.length > 66) {
        return decodeENSName(result);
      }
    }
  } catch (e) {}

  // Fallback: try public ENS API
  try {
    const resp = await fetch(`https://api.ensideas.com/ens/resolve/${address}`);
    const text = await resp.text();
    if (text.startsWith('{')) {
      const data = JSON.parse(text);
      if (data.name) return data.name;
    }
  } catch (e) {}

  return null;
}

function encodeNode(name) {
  // Simple namehash encoding placeholder - use API fallback instead
  return '0'.repeat(64);
}

function decodeENSName(hex) {
  try {
    if (hex.length < 130) return null;
    const len = parseInt(hex.slice(66, 130), 16);
    if (len === 0 || len > 100) return null;
    let name = '';
    for (let i = 0; i < len * 2; i += 2) {
      const byte = parseInt(hex.slice(130 + i, 132 + i), 16);
      if (byte > 0) name += String.fromCharCode(byte);
    }
    return name.includes('.') ? name : null;
  } catch (e) {
    return null;
  }
}

  // Always set up share button

  // Show owner
  const owner = city.owner || tileOwners[index];
  if (owner) {
    const shortAddr = owner.slice(0, 8) + '...' + owner.slice(-6);

    if (connectedWallet && owner.toLowerCase() === connectedWallet.toLowerCase()) {

    // Try ENS
    const ens = await resolveENS(owner);
    if (ens) {

    } else {
      ownerEl.innerHTML = `<span style="color:#e94560">Owner:</span> <a href="https://etherscan.io/address/${owner}" target="_blank" style="color:#c3ff00;text-decoration:none">${shortAddr}</a>`;
    }

    // Show update tx if exists

      txEl.innerHTML += `<br><a href="https://etherscan.io/tx/${city.updateTxHash}" target="_blank" style="color:#888;text-decoration:none;font-size:10px">Latest update</a>`;

      tileOwners[index] = fetchedOwner.toLowerCase();

// Event handlers
function setupEvents() {
  const container = document.getElementById('world-container');
  const canvas = document.getElementById('world');

  // Mouse wheel zoom
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoom = Math.max(0.1, Math.min(3, zoom * delta));
    renderWorld();
  });

  // Pan with drag
  container.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    container.classList.add('grabbing');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    renderWorld();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    container.classList.remove('grabbing');
  });

  // Click to select city
  canvas.addEventListener('click', (e) => {
    if (Math.abs(e.clientX - lastX) > 5 || Math.abs(e.clientY - lastY) > 5) return; // ignore drags

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const cityIndex = getCityAtPoint(x, y);
    if (cityIndex >= 0) {
      showCityPanel(cityIndex);
    }
  });

  // Track click start for drag detection
  canvas.addEventListener('mousedown', (e) => {
    lastX = e.clientX;
    lastY = e.clientY;
  });

  // Resize handler
  window.addEventListener('resize', renderWorld);

  // Touch support
  let lastTouchDist = 0;

  container.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });

  container.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      panX += e.touches[0].clientX - lastX;
      panY += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      renderWorld();
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastTouchDist > 0) {
        zoom = Math.max(0.1, Math.min(3, zoom * (dist / lastTouchDist)));
        renderWorld();
      }
      lastTouchDist = dist;
    }
  });

  container.addEventListener('touchend', () => {
    isDragging = false;
    lastTouchDist = 0;
  });
}

// Initialize
async function init() {
  const statusEl = document.getElementById('load-status');

  try {
    statusEl.textContent = 'Loading cities...';
    await loadCities();

    statusEl.textContent = 'Loading spritesheet...';
    await loadSpritesheet();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('city-count').textContent = cities.length;

    setupEvents();
    renderWorld();

    // Check for existing wallet connection
    const provider = getProvider();
    if (provider) {
      const accounts = await provider.request({ method: 'eth_accounts' });
      if (accounts.length > 0) {
        connectedWallet = accounts[0].toLowerCase();
        document.getElementById('wallet-btn').textContent = connectedWallet.slice(0, 6) + '...' + connectedWallet.slice(-4);
        document.getElementById('wallet-btn').style.color = '#c3ff00';
      }
    }

    // Load contributions panel
    loadContributions();

    // Check for hash anchor to focus on a specific tile (e.g., #5)
    checkHashAnchor();

  } catch (error) {
    statusEl.textContent = 'Error: ' + error.message;
    console.error(error);
  }
}

// Contributions tracking
let contributions = [];
let contributionsView = 'recent'; // 'recent' or 'leaderboard'
let ensNames = {}; // address => ENS name cache

async function loadContributions() {
  try {
    const resp = await fetch('https://chainhost.online/api/isocity/contributions');
    if (resp.ok) {
      const data = await resp.json();
      contributions = data.contributions || [];
      renderContributors();
      // Load ENS names in background
      resolveEnsNames();
    }
  } catch (e) {
    console.error('Failed to load contributions:', e);
    document.getElementById('contributors-list').innerHTML =
      '<div style="color:#666;font-size:11px">Could not load</div>';
  }
}

// Resolve ENS names for all contributor addresses
async function resolveEnsNames() {
  const addresses = [...new Set(contributions.map(c => c.address.toLowerCase()))];
  for (const addr of addresses) {
    if (ensNames[addr]) continue; // Already cached
    try {
      const name = await lookupEns(addr);
      if (name) {
        ensNames[addr] = name;
        renderContributors(); // Re-render with new name
      }
    } catch (e) {
      // Ignore lookup failures
    }
  }
}

// Lookup ENS name for an address
async function lookupEns(address) {
  try {
    // Use ENS reverse resolver via eth_call
    const res = await fetch('https://1rpc.io/eth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: 1,
        method: 'eth_call',
        params: [{
          to: '0x3671ae578e63fdf66ad4f3e12cc0c0d71ac7510c', // ENS reverse registrar
          data: '0x691f3431' + address.slice(2).toLowerCase().padStart(64, '0')
        }, 'latest']
      })
    });
    const { result } = await res.json();
    if (!result || result === '0x' || result.length < 130) return null;
    // Decode string from ABI
    const len = parseInt(result.slice(130, 194), 16);
    if (len === 0 || len > 100) return null;
    const hex = result.slice(194, 194 + len * 2);
    const name = decodeURIComponent(hex.replace(/(.{2})/g, '%$1'));
    return name.endsWith('.eth') ? name : null;
  } catch (e) {
    return null;
  }
}

function renderContributors() {
  const listEl = document.getElementById('contributors-list');

  if (contributions.length === 0) {
    listEl.innerHTML = '<div style="color:#666;font-size:11px">No contributions yet</div>';
    return;
  }

  if (contributionsView === 'recent') {
    // Show most recent contributions
    const recent = [...contributions]
      .sort((a, b) => b.timestamp - a.timestamp)
      .slice(0, 10);

    listEl.innerHTML = recent.map(c => {
      const shortAddr = c.address.slice(0, 6) + '...' + c.address.slice(-4);
      const displayName = ensNames[c.address.toLowerCase()] || shortAddr;
      const timeAgo = getTimeAgo(c.timestamp);
      const tileName = c.name || tileNames[c.tileId] || `Tile #${c.tileId}`;
      return `
        <div class="contributor-item">
          <span class="contributor-addr" title="${c.address}">${displayName}</span>
          <a href="#" class="contributor-tile" onclick="zoomToTile(${c.tileId});return false;" title="Tile #${c.tileId}">${tileName}</a>
          <span class="contributor-time">${timeAgo}</span>
        </div>
      `;
    }).join('');
  } else {
    // Show leaderboard (grouped by address with counts)
    const counts = {};
    contributions.forEach(c => {
      const addr = c.address.toLowerCase();
      counts[addr] = (counts[addr] || 0) + 1;
    });

    const sorted = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    listEl.innerHTML = sorted.map(([addr, count], i) => {
      const shortAddr = addr.slice(0, 6) + '...' + addr.slice(-4);
      const displayName = ensNames[addr.toLowerCase()] || shortAddr;
      return `
        <div class="contributor-item">
          <span style="color:#555;width:16px">#${i + 1}</span>
          <span class="contributor-addr" title="${addr}">${displayName}</span>
          <span class="contributor-count">${count}</span>
        </div>
      `;
    }).join('');
  }
}

function showRecentContributions() {
  contributionsView = 'recent';
  document.querySelectorAll('.leaderboard-toggle button').forEach((btn, i) => {
    btn.classList.toggle('active', i === 0);
  });
  renderContributors();
}

function showTopContributors() {
  contributionsView = 'leaderboard';
  document.querySelectorAll('.leaderboard-toggle button').forEach((btn, i) => {
    btn.classList.toggle('active', i === 1);
  });
  renderContributors();
}

function getTimeAgo(timestamp) {
  const seconds = Math.floor((Date.now() - timestamp) / 1000);
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return Math.floor(seconds / 86400) + 'd ago';
}

// Refresh contributions every 30 seconds
setInterval(loadContributions, 30000);

// Panel toggle functions
function toggleControls() {
  const panel = document.getElementById('controls-panel');
  const icon = document.getElementById('controls-icon');
  const isMinimized = panel.classList.toggle('minimized');
  icon.classList.toggle('visible', isMinimized);
  localStorage.setItem('isocity_controls_minimized', isMinimized);
}

function toggleContributors() {
  const panel = document.getElementById('contributors-panel');
  const icon = document.getElementById('contributors-icon');
  const isMinimized = panel.classList.toggle('minimized');
  icon.classList.toggle('visible', isMinimized);
  localStorage.setItem('isocity_contributors_minimized', isMinimized);
}

// Restore panel states from localStorage
function restorePanelStates() {
  if (localStorage.getItem('isocity_controls_minimized') === 'true') {
    document.getElementById('controls-panel').classList.add('minimized');
    document.getElementById('controls-icon').classList.add('visible');
  }
  // Always show contributors panel - clear any bad state
  localStorage.removeItem('isocity_contributors_minimized');
  document.getElementById('contributors-panel').classList.remove('minimized');
  document.getElementById('contributors-icon').classList.remove('visible');
}

// Handle hash anchor to focus on specific tile
function checkHashAnchor() {
  const hash = window.location.hash;
  if (hash && hash.startsWith('#')) {
    const tileId = parseInt(hash.slice(1));
    if (!isNaN(tileId) && tileId >= 0 && tileId < cities.length) {
      // Small delay to ensure rendering is complete
      setTimeout(() => {
        zoomToTile(tileId);
        // Update OG meta tags dynamically for this tile
        updateMetaForTile(tileId);
      }, 100);
    }
  }
}

// Update meta tags for specific tile (for better sharing)
function updateMetaForTile(tileId) {
  const tileName = tileNames[tileId] || `Tile #${tileId}`;
  document.title = `${tileName} - IsoCity`;

  // Update OG tags
  const ogTitle = document.querySelector('meta[property="og:title"]');
  const twitterTitle = document.querySelector('meta[name="twitter:title"]');
  if (ogTitle) ogTitle.setAttribute('content', `${tileName} - IsoCity`);
  if (twitterTitle) twitterTitle.setAttribute('content', `${tileName} - IsoCity`);
}

// Listen for hash changes
window.addEventListener('hashchange', checkHashAnchor);

restorePanelStates();
init();
</script>
